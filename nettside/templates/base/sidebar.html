<aside class="sidebar">
  <div class="sidebar-header">
    <h2 class="brand">InvoicePro</h2>
    <span class="brand-sub">Dashboard</span>
  </div>

  <nav class="sidebar-nav">

    <a class="sidebar-link {% if request.endpoint == 'services.tjenester' %}active{% endif %}"
       href="{{ url_for('services.tjenester') }}">
      ➕ Ny faktura
    </a>

    <div class="sidebar-group">

      <button class="sidebar-toggle" type="button">📄 Faktura</button>

      <div class="sidebar-submenu">

        <a class="{% if current_status is defined and current_status == 'utkast' %}active{% endif %}"
           href="{{ url_for('faktura.faktura_arkiv', status='utkast') }}">
          Ubetalte
        </a>

        <a class="{% if current_status is defined and current_status == 'sendt' %}active{% endif %}"
           href="{{ url_for('faktura.faktura_arkiv', status='sendt') }}">
          Sendte
        </a>

        <a class="{% if current_status is defined and current_status == 'betalt' %}active{% endif %}"
           href="{{ url_for('faktura.faktura_arkiv', status='betalt') }}">
          Betalt
        </a>

      </div>
    </div>

    <a class="sidebar-link {% if request.endpoint == 'kunde.kundeliste' %}active{% endif %}"
       href="{{ url_for('kunde.kundeliste') }}">
      👥 Kunder
    </a>

    <a class="sidebar-link {% if request.endpoint == 'faktura.firma_innstillinger' %}active{% endif %}"
       href="{{ url_for('faktura.firma_innstillinger') }}">

  </nav>
