{% extends "base.html" %}

{% block head %}
<title>Ny Faktura</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style_tjenester.css') }}">
<script src="/static/javascript/tjenester-java.js" defer></script>
<script src="/static/javascript/sidebar-java.js" defer></script>
{% endblock %}

{% block body %}
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>InvoicePro</h2>
      <span>Dashboard</span>
    </div>

    <nav class="menu">
      <a class="menu-link active" href="{{ url_for('tjenester') }}">➕ Ny faktura</a>

      <div class="menu-group">
        <button class="menu-toggle">📄 Faktura</button>
        <div class="submenu">
          <a href="{{ url_for('lagret_fakturaer') }}">Ubetalte</a>
          <a href="{{ url_for('sendte') }}">Sendte</a>
          <a href="{{ url_for('betalt') }}">Betalt</a>
        </div>
      </div>

      <a class="menu-link" href="#">👥 Kunder</a>
      <a class="menu-link" href="#">📦 Produkter</a>
      <a class="menu-link" href="#">📊 Rapporter</a>
      <a class="menu-link" href="#">💲 Transaksjoner</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="invoice-card">
      <h1 class="page-title">Opprett ny faktura</h1>

      <form action="/generate-invoice" method="POST">

        <section class="form-section">
          <h2>Mottaker</h2>
          <div class="grid-2">
            <div>
              <label>Firmanavn</label>
              <input list="kunder_list" id="firmanavn" name="firmanavn" placeholder="Velg eller skriv inn" required>
            </div>
            <div>
              <label>Org.nr</label>
              <input type="text" id="orgnr" name="orgnr">
            </div>
            <div>
              <label>Adresse</label>
              <input type="text" id="firmaadresse" name="firmaadresse">
            </div>
            <div>
              <label>Referanse</label>
              <input type="text" id="referanse" name="referanse">
            </div>
          </div>
        </section>

        <section class="form-section">
          <h2>Fakturadetaljer</h2>
          <div class="grid-3">
            <input type="date" readonly>
            <input type="number" value="7">
            <input type="text" readonly>
          </div>
        </section>

        <section class="form-section">
          <h2>Produkter</h2>
          <div class="produkt-row">
            <input type="text" placeholder="Produkt">
            <input type="number" placeholder="Antall">
            <input type="number" step="0.01" placeholder="Pris">
          </div>
        </section>

        <div class="submit-area">
          <button class="primary-btn" type="submit">Lag faktura</button>
        </div>

      </form>
    </div>
  </main>

</div>
{% endblock %}
