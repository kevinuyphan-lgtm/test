{% extends "base.html" %}

{% block head %}
<title>Registrer</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style_base.css') }}">
{% endblock %}

{% block body %}
<div class="form-container">
    <h2>Registrer deg</h2>
    <form action="/register" method="POST">
        <label for="name">Fullt navn:</label>
        <input type="text" id="name" name="name" placeholder="Skriv inn navnet ditt" required>

        <label for="email">E-post:</label>
        <input type="email" id="email" name="email" placeholder="Skriv inn e-posten din" required>

        <label for="password">Passord:</label>
        <input type="password" id="password" name="password" placeholder="Lag et passord" required>

        <label for="confirm_password">Bekreft passord:</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Gjenta passordet" required>

        <button type="submit" class="btn-primary">Registrer</button>
    </form>

    <p>Har du allerede en konto? <a href="/login">Logg inn her</a>.</p>
</div>
{% endblock %}
