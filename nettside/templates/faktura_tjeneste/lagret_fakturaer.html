{% extends "base/base_faktura.html" %}

{% block head %}
<title>Lagrede Fakturaer</title>

<link rel="stylesheet" href="{{ url_for('static', filename='base/style_base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='base/style_sidebar.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='faktura_tjeneste/style_lagret_fakturaer.css') }}">

<script src="{{ url_for('static', filename='javascript/sidebar-java.js') }}" defer></script>
<script src="{{ url_for('static', filename='javascript/lagret_fakturaer-javar.js') }}" defer></script>
{% endblock %}

{% block body %}
<div class="main-content">

  <!-- TOP CONTROLS -->
  <div class="top-controls">
    <input type="text" id="searchInput" placeholder="Søk faktura..." class="search-bar">
    <select id="sortSelect" class="sort-select">
      <option value="dato_desc">Nyeste først</option>
      <option value="dato_asc">Eldste først</option>
      <option value="navn_asc">Navn A → Å</option>
      <option value="navn_desc">Navn Å → A</option>
    </select>
    <button id="sendSelected" class="send-btn" disabled>✉ Send valgte</button>
  </div>

  <!-- FAKTURA GRID -->
  <div class="faktura-grid" id="fakturaContainer">
    {% if fakturaer %}
      {% for f in fakturaer %}
      <div class="faktura-card"
           data-dato="{{ f.dato.strftime('%Y-%m-%d') }}"
           data-navn="{{ f.filnavn }}">
        
        <input type="checkbox" class="faktura-checkbox" value="{{ f.id }}">

        <div class="pdf-preview-card">
          <iframe src="/faktura/{{ f.filnavn }}"></iframe>
        </div>

        <div class="faktura-footer">
          <span>{{ f.filnavn }}</span>
          <span>{{ f.dato.strftime('%d.%m.%Y') }}</span>
        </div>
      </div>
      {% endfor %}
    {% else %}
      <p class="empty-message">Ingen lagrede fakturaer.</p>
    {% endif %}
  </div>

</div>

<!-- SEND POPUP -->
<div class="popup-overlay" id="sendPopup">
  <div class="popup-box">
    <h2>Send fakturaer</h2>

    <div id="emailContainer">
      <div class="email-field">
        <input type="email" placeholder="Skriv inn epost" class="email-input">
      </div>
    </div>

    <button type="button" id="addEmail" class="add-email-btn">
      + Legg til flere
    </button>

    <div class="popup-buttons">
      <button type="button" id="cancelSend" class="cancel-btn">
        Avbryt
      </button>
      <button type="button" id="confirmSend" class="confirm-btn" disabled>
        Send
      </button>
    </div>
  </div>
</div>

{% endblock %}
