{% extends "base.html" %}

{% block head %}
<title>Tilbakestill passord</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style_base.css') }}">
{% endblock %}

{% block body %}
<div class="form-container">
    <h2>Tilbakestill passord</h2>
    <form action="{{ url_for('reset_with_token', token=token) }}" method="POST">
        <label for="password">Nytt passord:</label>
        <input type="password" id="password" name="password" placeholder="Skriv inn nytt passord" required>

        <label for="confirm_password">Bekreft nytt passord:</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Gjenta nytt passord" required>

        <button type="submit" class="btn-primary">Oppdater passord</button>
    </form>

    <p><a href="{{ url_for('login') }}">Tilbake til innlogging</a></p>
</div>
{% endblock %}
