{% extends "base/base.html" %}

{% block head %}
<title>Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style_base.css') }}">
{% endblock %}

{% block body %}
<div class="form-container">
    <h2>Login</h2>
    <form action="/login" method="POST">
        <label for="email">E-post:</label>
        <input type="email" id="email" name="email" placeholder="Skriv inn e-posten din" required>

        <label for="password">Passord:</label>
        <input type="password" id="password" name="password" placeholder="Skriv inn passordet ditt" required>

        <button type="submit" class="btn-primary">Logg inn</button>
    </form>

    <p>
    Har du ikke en konto? <a href="/register">Registrer deg her</a>.<br>
    Glemt passord? <a href="{{ url_for('auth.forgot_password') }}">Klikk her</a>.
    </p>

</div>
{% endblock %}
