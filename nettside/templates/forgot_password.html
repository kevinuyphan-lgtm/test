{% extends "base.html" %}

{% block head %}
<title>Glemt passord</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style_base.css') }}">
{% endblock %}

{% block body %}
<div class="form-container">
    <h2>Glemt passord</h2>
    <p>Skriv inn e-posten din. Hvis e-posten finnes, vil en reset-link vises i serverloggen.</p>

    <form action="{{ url_for('forgot_password') }}" method="POST">
        <label for="email">E-post:</label>
        <input type="email" id="email" name="email" placeholder="Skriv inn e-posten din" required>

        <button type="submit" class="btn-primary">Send reset-link</button>
    </form>

    <p><a href="{{ url_for('login') }}">Tilbake til innlogging</a></p>
</div>
{% endblock %}
